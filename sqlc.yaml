version: '2'
sql:
  - schema: sql/schema.sql
    queries: sql/queries
    engine: sqlite
    codegen:
      - out: src/xrayproxy/generated/sqlc
        plugin: py
        options:
          package: xrayproxy.generated.sqlc
          emit_sync_querier: true
          emit_async_querier: false
plugins:
- name: py
  wasm:
