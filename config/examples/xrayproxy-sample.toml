log_verbosity = "DEBUG"

[storage]
endpoint_url = "https://<ACCOUNT_ID>.r2.cloudflarestorage.com"
region = "auto"
access_key_id = "<accessKeyId>"
secret_access_key = "<secretAccessKey>"
resource_bucket = "x-ray"
data_bucket = "x-ray"
api_log_bucket = "x-ray-log"
allow_public_access = false

[storage.cloudflare]
# publicなR2バケットのEdge Cache削除に使うCloudflare APIトークン
api_token = "<cloudflareApiToken>"
# Cloudflare DNSゾーンのZone ID
zone_id = "<cloudflareZoneId>"
# publicなresource_bucketの公開ホスト名
resource_bucket_public_host_name = "pub-resource-xxxxxxxxxxxxxxxxxxxxxxxx.r2.dev"
# publicなdata_bucketの公開ホスト名
data_bucket_public_host_name = "pub-data-xxxxxxxxxxxxxxxxxxxxxxxxxxxx.r2.dev"

[resource]
save_mode = "default"
ship_graphic_versioning = false

[api_log]
save_sortie_log = false
save_practice_log = false
save_other_log = false
pretty = false

[logbook_kai]
enabled = false
host = "127.0.0.1"
port = 8888

