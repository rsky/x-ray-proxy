services:
  minio:
    container_name: x-ray-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1@sha256:13582eff79c6605a2d315bdd0e70164142ea7e98fc8411e9e10d089502a6d883
    environment:
      - MINIO_ROOT_USER=dummy-access-key
      - MINIO_ROOT_PASSWORD=dummy-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    command: server /data --address :9000 --console-address :9001
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 2s
      retries: 3
      start_period: 1s
  create_buckets:
    container_name: x-ray-create-buckets
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1@sha256:13582eff79c6605a2d315bdd0e70164142ea7e98fc8411e9e10d089502a6d883
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 dummy-access-key dummy-secret-key;
      mc mb --ignore-existing myminio/x-ray;
      mc mb --ignore-existing myminio/x-ray-log;
      mc anonymous set download myminio/x-ray;
      mc anonymous set none myminio/x-ray-log;
      "
  proxy:
    container_name: x-ray-proxy
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    tty: true
    environment:
      - "TZ=Asia/Tokyo"
    depends_on:
      create_buckets:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - ./data:/var/lib/x-ray-proxy/data
      - ./config/xrayproxy-docker.toml:/var/lib/x-ray-proxy/config/xrayproxy.toml:ro
    extra_hosts:
      - host.docker.internal:host-gateway
